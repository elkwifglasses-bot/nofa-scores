/* Start screen */
#splash { position: fixed; inset: 0; z-index: 100; background: #0E1012; overflow: hidden; }

#splash .sp-bg svg { position: absolute; width: 38px; height: 38px; color: inherit; animation: none; }
#splash[hidden] { display: none; }
/* The logo sits exactly where Android's own start screen draws the app icon (centred, same size), so the hand-over doesn't jump.
   It starts in the icon's green and fades to the chosen colour scheme; the tagline sits below it without moving it. */
/* Size and position measured from screen recordings on Lukas's phone (Android start screen vs. this one, 26 Nov 2026):
   Android draws the icon 12.5% larger and centred on the whole screen, i.e. 21 px above the middle of the app's area
   (status bar 65 px at the top, gesture bar 23 px at the bottom). --sp-size / --sp-dy match it. */
#splash { --sp-size: 169px; --sp-dy: -21px; }
#splash > svg { position: absolute; left: calc(50% - var(--sp-size) / 2); top: calc(50% - var(--sp-size) / 2 + var(--sp-dy)); width: var(--sp-size); height: var(--sp-size); color: var(--accent); }
#splash .sp-t { position: absolute; left: 0; right: 0; top: calc(50% + var(--sp-size) / 2 + var(--sp-dy) + 28px); font: 600 24px/1.25 var(--display); letter-spacing: .01em; color: var(--fg); text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  #splash > svg { animation: sp-col 1.2s ease-in-out .2s both; }
  #splash .sp-bg { animation: sp-bg 1.2s ease-out both; }
  #splash .sp-t { opacity: 0; }
  #splash.ft .sp-t { animation: sp-t .6s cubic-bezier(.2,.7,.2,1) both; }

    // Next week / next round (predictions)
    next: SECS('All of next week’s upcoming matches (from Tuesday to Monday). Pick a league to see its next round instead.<br>Upcoming matches get a prediction instead of a rating.', POTKEY,

  const sectionHead = (v, P) => '<div class="favhead sect"><h2 class="label">' + (v === 'best' ? 'League' : 'Matches') + '</h2>' +

    (infoOpen ? '<div class="hdim idim"></div><div class="infobox bubble" id="infobox" role="dialog" aria-label="About this tab">' + INFO[v === 'matchweek' && P && P.next ? 'next' : v] + '</div>' : '') + '</div>';

  // ---- Team popup (tap a team in the Season table) ----
  let pop = null, popY = 0, popSort = 'new', popMenu = false, popList = 0;

  let gOpen = true, lOpen = true, gSel = null, gScroll = null;

    let h = '<div class="tdim" data-close="1"></div><div class="tpop" role="dialog" aria-label="' + esc(name(n)) + '">' +
      '<div class="tph"><div><div class="tpn">' + badge(c, n, 32) + '<span>' + nm(n, 1) + '</span><span class="chip ' + atier(me.avg) + '" title="Average rating">' + me.avg.toFixed(1) + '</span></div>' +
      '<div class="tpl">' + FLAG[c] + '<span>' + C[c] + ' · #' + me.rk + ' by avg rating</span></div></div>' +
      '<button type="button" class="tpx" data-act="tclose" aria-label="Close" title="Close">✕</button></div>' +

    box.innerHTML = h + '</div></section></div></div>';

    const body = box.querySelector('.tpb'); if (body) body.scrollTop = popList;
  }
  // Team graph: one dot per rated match, oldest left; the 10 most recent fill the width, older ones are reached by scrolling left.
  // Grey bands hint at the rating zones (8.5 / 7 / 4); dots take the rating colour. The tapped dot's bubble floats above everything.
  const YMIN = 2.5; // y axis starts at 2.5 (no match has been rated lower); a lower rating sits on the bottom line
  let gDraw = false; // play the draw-in once (opening the team, or showing the graph again)
  function drawGraph(team, avg, ms) {
    const el = document.querySelector('.tpop .tg'); if (!el) return;
    const old = el.querySelector('.tgs'); if (old) gScroll = old.scrollLeft;
    const W = el.clientWidth || 340, H = 173, pt = 6, pb = 24, pl = 14, pr = 12, ih = H - pt - pb, n = ms.length;
    const step = n > 10 ? (W - pl - pr) / 9 : n > 1 ? (W - pl - pr) / (n - 1) : 0, CW = n > 10 ? Math.round(pl + pr + step * (n - 1)) : W;
    const X = (i) => (n === 1 ? W / 2 : pl + step * i), Y = (v) => pt + ih * (1 - (Math.max(YMIN, v) - YMIN) / (10 - YMIN));
    let g = '<svg class="tgsvg" width="' + CW + '" height="' + H + '" aria-hidden="true">';
    [[8.5, 10, 'z1'], [7, 8.5, 'z2'], [4, 7, 'z3']].forEach(([a, b, z]) => { g += '<rect class="' + z + '" x="0" y="' + Y(b) + '" width="' + CW + '" height="' + (Y(a) - Y(b)) + '"/>'; });
    [YMIN, 4, 7, 8.5, 10].forEach((v) => { g += '<line class="gl" x1="0" x2="' + CW + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>'; });
    if (n > 1) g += '<polyline class="gp" points="' + ms.map((m, i) => X(i).toFixed(1) + ',' + Y(m.rt).toFixed(1)).join(' ') + '"/>';
    const dc = (r) => (r >= 8.5 ? 'd1' : r >= 7 ? 'd2' : r >= 4 ? 'd3' : 'dr');

    let f = null;
    if (['favteam', 'tsort'].includes(act)) f = document.querySelector('[data-act="' + act + '"][data-id="' + CSS.escape(id) + '"]');
    if (act === 'comp') f = document.querySelector('[data-act="comp"][data-id="' + id + '"]');
    if (f) f.focus({ preventScroll: true });
    const slide = document.querySelector('#main .slide');
    if (act === 'comp' && slide) { const kids = Array.from(slide.children), i = kids.findIndex((k) => k.classList.contains('pills')); fadeUp(kids.slice(i + 1), 40); }
    if (act === 'tsort') fadeUp(Array.from(document.querySelectorAll('#main .ttab > .trow:not(.thead), #main .ttab > .tbtn')), 15);
    if (act === 'favteam' && f) { const nx = f.nextElementSibling; if (nx && nx.classList.contains('row')) grow(nx); }
  });

  // Swipe left / right on the list: next / previous day, week or round (the list follows the finger)
  (() => {
    const main = document.getElementById('main');
    let sw = null;
    const reset = (el) => { const cur = el.style.transform; el.style.transform = ''; el.style.opacity = ''; anim(el, [{ transform: cur || 'none' }, { transform: 'none' }], { duration: 200 }); };
    const area = document.getElementById('wrap');
    area.addEventListener('touchstart', (e) => {
      sw = null;
      if (pop || hp || mpop || busy || e.touches.length !== 1 || view() === 'best' || view() === 'fav') return;
      if (e.target.closest('.tpop, .search, input')) return;
      const el = document.querySelector('#main .slide'); if (!el) return;
      sw = { x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, on: false, el };
    }, { passive: true });
    area.addEventListener('touchmove', (e) => {
      if (!sw) return;
      const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
      if (!sw.on) {
        if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.6) sw.on = true;
        else { if (Math.abs(dy) > 14) sw = null; return; }
      }
      const btn = document.querySelector('#dbar [data-act="' + (dx < 0 ? 'next' : 'prev') + '"]'), ok = btn && !btn.disabled;
      sw.dx = dx; sw.ok = ok;
      if (moving()) { sw.el.style.transform = 'translateX(' + (ok ? dx * 0.6 : dx / 6) + 'px)'; sw.el.style.opacity = String(Math.max(0.5, 1 - Math.abs(dx) / 600)); }
    }, { passive: true });
    const end = () => {
      if (!sw) return; const s = sw; sw = null; if (!s.on) return;
      if (s.ok && Math.abs(s.dx) > 60) { const x = s.dx * 0.6; s.el.style.transform = ''; s.el.style.opacity = ''; go(s.dx < 0 ? 'next' : 'prev', moving() ? x : 0); }
      else reset(s.el);
    };
    area.addEventListener('touchend', end);
    area.addEventListener('touchcancel', () => { if (sw && sw.on) reset(sw.el); sw = null; });
  })();
  window.addEventListener('hashchange', () => { infoOpen = false; if (hp) { hp = null; } pop = null; if (location.hash === '#outlook') { st.next = true; history.replaceState(null, '', '#week'); } render(); anim(document.querySelector('#main .slide'), [{ opacity: 0 }, { opacity: 1 }], { duration: 200 }); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (mpop) { closeMatch(); return; }
    if (hp) { closeHp(); return; }
    if (pop) { if (popMenu) { popMenu = false; renderPop(); } else closePop(); return; }
    if (infoOpen) closeInfo(() => { keep(() => {}); const f = document.querySelector('[data-act="info"]'); if (f) f.focus({ preventScroll: true }); });
  });
  render();

  // Data: data/matches.json ({ updated, matches: [ {id, c, r, d, h, a, rt, s, w, q} ] }) and data/fixtures.json ({ <league>: {c, r, matches: [{h, a, d}]} }).
  // Loaded on start and again whenever the app comes back to the foreground, so the morning update shows up without a reload.
  async function load() {
    try {
      const get = (u) => fetch(u + '?t=' + Date.now(), { cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
      const [d, f, rl] = await Promise.all([get('data/matches.json'), get('data/fixtures.json').catch(() => ({})), get('data/runs.json').catch(() => ({}))]);
      RUNS = (rl && Array.isArray(rl.runs) ? rl.runs : []).filter((r) => r && r.start).sort((a, b) => (a.start < b.start ? 1 : -1));
      D = (d.matches || []).filter((m) => m && m.id && m.h && m.a && C[m.c]);
      const fx = {}; Object.values(f || {}).forEach((b) => { if (b && C[b.c] && Array.isArray(b.matches)) fx[b.c] = b; });
      FX = fx; loaded = true; failed = false; buildPred();
    } catch (e) { if (!loaded) failed = true; }
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }
  // Start screen background: every club badge, in a staggered grid that covers the screen (a fixed shuffle, so it looks the same each time)
  (function () {
    const sp = document.getElementById('splash'), bg = sp && sp.querySelector('.sp-bg'); if (!bg || sp.hidden) return;
    const all = Object.keys(BSPEC).sort((a, b) => bh(a + 'x') - bh(b + 'x')), G2 = 44, GY = 41, cols = Math.ceil(innerWidth / G2) + 2, rows = Math.ceil(innerHeight / GY) + 2;
    let h = '';
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const [lg, ...n] = all[(r * (cols + 5) + c) % all.length].split('|');
      h += badge(lg, n.join('|'), 38).replace('<svg ', '<svg style="left:' + (c * G2 - (r % 2 ? 0 : G2 / 2) - 10) + 'px;top:' + (r * GY - 14) + 'px" '); }
    bg.innerHTML = h;
  })();
  // Start screen stays about 3 s (longer only while the data is still on its way, at most 5 s), then fades into the app
  let splashGone = false;
  function hideSplash() {
    const sp = document.getElementById('splash'); if (!sp || sp.hidden || splashGone) return; splashGone = true;
    const wait = Math.max(0, 3000 - (performance.now() - (window.__splashAt || 0)));
    setTimeout(() => after(anim(sp, [{ opacity: 1 }, { opacity: 0 }], { duration: 420, fill: 'forwards' }), () => sp.remove()), wait);
  }
  setTimeout(hideSplash, 5000);
  load().then(hideSplash, hideSplash);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
  // Updates: check for a new version on every start and whenever the app comes back to the foreground;
  // when a new version takes over, reload once so it shows right away
  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {}));
  }
})();
</script>

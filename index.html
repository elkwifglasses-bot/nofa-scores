/* Layout: mobile-first single column (wider grid for Season); game rows closed by default, tap to open the action bar. Dark-only by design. */
:root {

}
* { box-sizing: border-box; }

.wrap { max-width: 760px; margin: 0 auto; padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(64px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: var(--gap-block); }
.wrap.wide { max-width: 1180px; }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--divider); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 19px/1 var(--display); letter-spacing: -0.01em; }

nav { flex-wrap: wrap; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

/* One line per game, only green and red get a filled box, no row arrows, flat Season cards */

.ttab .nm { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttab .n { color: var(--muted); font-size: 12.5px; }
.ttab .avg { font-weight: 700; font-size: 13.5px; }
.avg.a1 { color: var(--accent); } .avg.a2 { color: #7FCBA5; } .avg.a3 { color: #DCE1E5; } .avg.ar { color: #F0606A; }
.ttab > .row { border-top: 1px solid var(--divider); }
.card.ttab > .thead { padding-top: 10px; }

/* Outlook predictions: dotted outline in the tier colour (real ratings are filled boxes) */
.chip.pred, .chip.pred.t1, .chip.pred.t2, .chip.pred.t3, .chip.pred.tr { box-shadow: none; border: 2px dotted; }
.chip.pred.t1 { border-color: var(--accent); }
.chip.pred.t2 { border-color: #3FA478; }
.chip.pred.t3 { border-color: #6A7279; }
.chip.pred.tr { border-color: #F0606A; }
/* Sortable team table headings */
.ttab .thead .tsort { min-height: 0; height: auto; padding: 2px 0; border: 0; border-radius: 4px; background: transparent; color: #7B838A; font: inherit; letter-spacing: inherit; text-transform: inherit; display: inline-flex; align-items: center; gap: 2px; justify-content: flex-start; position: relative; }
.ttab .thead .tsort.c { justify-content: center; }
.ttab .thead .tsort:hover { color: var(--fg); background: transparent; }
.ttab .thead .tsort.on { color: var(--fg); }
.ttab .thead .tsort .arr { font-size: 7px; line-height: 1; }
.ttab .thead .tsort.c .arr { position: absolute; right: -1px; top: 50%; transform: translateY(-50%); }

.star { color: inherit; }
.selsec > h2.label .flag { width: 16px; height: 11px; border-radius: 2px; }
.selsec > .grid { margin-top: 2px; }
.pbar .sq.back svg { transform: scaleX(-1); }
.infobox .potv { display: inline; }
.infobox .potv .chip.pot { display: inline-flex; vertical-align: -2px; }
.infobox .chip.pot svg { width: 9px; height: 12px; }

/* The box between the team names (rating, score, "vs" or flames) always has the same width; a bit more air to the names */
.crow .line > .chip { width: 52px; min-width: 52px; padding: 0; margin-inline: 4px; }
.crow.ranked .line > .chip { margin-inline: 0; }
.crow .chip.score { font-size: 13px; letter-spacing: -0.01em; }
/* Predicted potential for matches still to come: 3 / 2 / 1 lit flames in a dotted box (real ratings are filled boxes) */
.chip.pot { background: transparent; border: 2px dotted #4A5158; gap: 0; }
.chip.pot.p3 { border-color: var(--accent); }
.chip.pot.p2 { border-color: #3FA478; }
.chip.pot svg { width: 10px; height: 14px; flex: none; }
.chip.pot .f { fill: #30363C; }
.chip.pot.p3 .f.on { fill: var(--accent); }
.chip.pot.p2 .f.on { fill: #8FD9B6; }
.chip.pot.p1 .f.on { fill: #7B838A; }
.crow .day { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.potv { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.potv .sep { color: var(--muted); font-weight: 400; }
.potv .chip.pot { width: auto; min-width: 0; height: auto; border: 0; padding: 0; }
/* Opened match: score panel (factors per team) and breakdown panel (what counted, points in brackets) */
.panel { margin: 0 12px 12px; background: var(--inset); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.panel + .panel { margin-top: -4px; }
.sth { display: grid; grid-template-columns: 1fr auto 1fr; font: 600 11px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 2px 0 6px; }
.sth span:last-child { text-align: right; }
.stl { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: baseline; gap: 8px; padding: 5px 0; border-top: 1px solid var(--divider); }
.stl .k { color: var(--muted); font-size: 12.5px; text-align: center; white-space: nowrap; }
.stl .v { font: 600 14px var(--display); font-variant-numeric: tabular-nums; }
.stl .v.r { text-align: right; }
.stl .v.z { color: #4A5158; font-weight: 500; }
.stl .v.lead { color: var(--accent); }
.stl.sm .v { font: 500 11.5px var(--text); color: var(--muted); }
.stl.foot { grid-template-columns: 1fr; }
.stl.foot .k { font-size: 11.5px; white-space: normal; }
.bkl { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--divider); }
.bkl:first-child { border-top: 0; }
.bkl .bn { font-size: 13.5px; min-width: 0; }
.bkl .bc { font-size: 12px; color: var(--muted); }
.bkl .bp { font: 700 14px var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bp.pbig { color: var(--accent); } .bp.pmid { color: #8FD9B6; } .bp.pgrey { color: var(--muted); } .bp.pneg { color: #F0606A; }
.bkl.tot { border-top: 1px solid var(--btn-line); margin-top: 2px; padding-top: 8px; }
.bkl.tot .bn { font-weight: 600; }
.bkl.tot .chip { min-width: 40px; height: 26px; border-radius: 8px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color: var(--accent)" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.2l4.2 3-1.6 4.9H9.4L7.8 10.2z" fill="currentColor" stroke="none"/></svg>
      nofa scores
    </div>
    <nav aria-label="Views">
      <a href="#day" data-view="day">Day</a>
      <a href="#week" data-view="matchweek">Week</a>
      <a href="#season" data-view="best">Season</a>
    </nav>
  </header>
  <main id="main" aria-live="polite">
    <div class="card"><div class="empty">Loading ratings…</div></div>
  </main>
</div>

<script>
(() => {
  const C = { sl: 'Super League', pl: 'Premier League', ll: 'La Liga', sa: 'Serie A', bl: 'Bundesliga', l1: 'Ligue 1' };
  const RN = { sl: 'Round', pl: 'Round', ll: 'Round', sa: 'Round', bl: 'Round', l1: 'Round' };
  const ORDER = ['sl', 'pl', 'll', 'sa', 'bl', 'l1'];
  const FAV = new Set(['Liverpool', 'FC Basel']);
  const svgf = (inner, label) => '<svg class="flag' + (label === 'Switzerland' ? ' flag-ch' : '') + '" viewBox="0 0 30 20" preserveAspectRatio="none" role="img" aria-label="' + label + '">' + inner + '</svg>';
  const FLAG = {
    sl: svgf('<rect x="5" width="20" height="20" rx="1.5" fill="#DA291C"/><rect x="13" y="4" width="4" height="12" fill="#fff"/><rect x="9" y="8" width="12" height="4" fill="#fff"/>', 'Switzerland'),
    pl: svgf('<rect width="30" height="20" fill="#fff"/><rect x="12.5" width="5" height="20" fill="#CE1124"/><rect y="7.5" width="30" height="5" fill="#CE1124"/>', 'England'),
    ll: svgf('<rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/>', 'Spain'),
    sa: svgf('<rect width="10" height="20" fill="#009246"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#CE2B37"/>', 'Italy'),
    bl: svgf('<rect width="30" height="6.67" fill="#000"/><rect y="6.67" width="30" height="6.67" fill="#DD0000"/><rect y="13.33" width="30" height="6.67" fill="#FFCE00"/>', 'Germany'),
    l1: svgf('<rect width="10" height="20" fill="#0055A4"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#EF4135"/>', 'France'),
  };
  // Greyed-out flags (rows when one league is selected): same shapes, greys instead of colours, so they don't draw the eye
  const G = { red: '#4A5157', white: '#7B838A', blue: '#2C3136', green: '#5F676E', black: '#272B2F', gold: '#6A7279' };
  const FLAGG = {
    sl: svgf('<rect x="5" width="20" height="20" rx="1.5" fill="' + G.red + '"/><rect x="13" y="4" width="4" height="12" fill="' + G.white + '"/><rect x="9" y="8" width="12" height="4" fill="' + G.white + '"/>', 'Switzerland'),
    pl: svgf('<rect width="30" height="20" fill="' + G.white + '"/><rect x="12.5" width="5" height="20" fill="' + G.red + '"/><rect y="7.5" width="30" height="5" fill="' + G.red + '"/>', 'England'),
    ll: svgf('<rect width="30" height="20" fill="' + G.red + '"/><rect y="5" width="30" height="10" fill="' + G.gold + '"/>', 'Spain'),
    sa: svgf('<rect width="10" height="20" fill="' + G.green + '"/><rect x="10" width="10" height="20" fill="' + G.white + '"/><rect x="20" width="10" height="20" fill="' + G.red + '"/>', 'Italy'),
    bl: svgf('<rect width="30" height="6.67" fill="' + G.black + '"/><rect y="6.67" width="30" height="6.67" fill="' + G.red + '"/><rect y="13.33" width="30" height="6.67" fill="' + G.gold + '"/>', 'Germany'),
    l1: svgf('<rect width="10" height="20" fill="' + G.blue + '"/><rect x="10" width="10" height="20" fill="' + G.white + '"/><rect x="20" width="10" height="20" fill="' + G.red + '"/>', 'France'),
  };
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], DAYL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const DAYMS = 86400000;
  const dt = (s) => new Date(s + 'T12:00:00Z');
  const iso = (d) => d.toISOString().slice(0, 10);
  const short = (s) => { const d = dt(s); return DAYS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; };
  const long = (s) => { const d = dt(s); return DAYL[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + MONL[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
  const tuesday = (s) => { const d = dt(s); return iso(new Date(d.getTime() - ((d.getUTCDay() + 5) % 7) * DAYMS)); };
  const plusDays = (s, n) => iso(new Date(dt(s).getTime() + n * DAYMS));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Shorter club names, so a game fits on one line on a phone
  const SHORT = { 'Racing Santander': 'Racing', 'Atletico Madrid': 'Atlético', 'Werder Bremen': 'Bremen', 'Hamburger SV': 'Hamburg', 'RB Leipzig': 'Leipzig', 'Deportivo La Coruna': 'Deportivo', 'Rayo Vallecano': 'Rayo', 'Athletic Club': 'Athletic', "Nott'm Forest": 'Forest', 'Crystal Palace': 'Palace', 'Union Berlin': 'Union', 'Real Sociedad': 'Sociedad', 'Aston Villa': 'Villa', 'Grasshoppers': 'GC' };
  const FIX = { 'Koln': 'Köln', 'FC Zurich': 'FC Zürich', 'Atletico Madrid': 'Atlético Madrid', 'Malaga': 'Málaga', 'Alaves': 'Alavés', 'Deportivo La Coruna': 'Deportivo La Coruña', 'Cadiz': 'Cádiz', 'Leganes': 'Leganés' };
  // Favourites get a ★ on the outer side: before the name for the home team, after it for the away team and in tables
  const name = (n, after) => { const t = SHORT[n] || FIX[n] || n; return FAV.has(n) ? (after ? t + ' ★' : '★ ' + t) : t; };
  const nm = (n, after) => esc(name(n, after)).replace('★', '<span class="star" aria-label="favourite">★</span>');
  // "Why" lines: one wording per item, whatever wording older daily runs stored (display only)
  const WHY_NAME = { 'Base': 'Starting score', 'Tight game': 'Close match', 'Lopsided': 'One-sided', 'Dead-game cap': 'Low-score cap', 'Top-end compression': 'High-score cap' };
  const whyPart = (p) => {
    if (/^(top-two\/bottom-two team|top-two team|bottom-two team|both in (top|bottom) two|top\/bottom 2)$/.test(p)) return 'top/bottom 2';
    if (/^(both top four\/bottom four|both top\/bottom 4)$/.test(p)) return 'both top/bottom 4';
    if (/^(derby\/rivalry|rivalry|derby)$/.test(p)) return 'derby';
    if (/^VAR(-awarded)? (goal\/penalty|goal|penalty|award)$/.test(p)) return 'VAR award';
    if (/^(missed|saved|scored) penalty$/.test(p)) return 'penalty';
    const sot = p.match(/^(\d+) shots on target$/); if (sot) return sot[1] + ' on target';
    return p;
  };
  const whyLabel = (t) => {
    const m = String(t).match(/^([^(]+?)\s*\((.*)\)$/);
    if (!m) return WHY_NAME[t] || t;
    const counts = new Map();
    m[2].split(', ').forEach((p) => { const k = p.match(/^(.*?)(?: ×(\d+))?$/), key = whyPart(k[1]); counts.set(key, (counts.get(key) || 0) + (+k[2] || 1)); });
    const parts = Array.from(counts, ([k, n]) => (n > 1 ? k + ' ×' + n : k)).join(', ').replace('top/bottom 2, both top/bottom 4', 'top/bottom 2 & 4');
    return (WHY_NAME[m[1]] || m[1]) + ' (' + parts + ')';
  };
  const RS = { sl: 'R', pl: 'MW', ll: 'MD', sa: 'MD', bl: 'MD', l1: 'MD' };
  const dm = (s) => { const d = dt(s); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; };
  const span = (a, b) => { const x = dt(a), y = dt(b); return x.getUTCMonth() === y.getUTCMonth() ? x.getUTCDate() + '–' + dm(b) : dm(a) + ' – ' + dm(b); };
  const wd = (s) => DAYS[dt(s).getUTCDay()];
  // Match ratings: must-watch 8.5+, good 7.0–8.4, average 4.0–6.9 (grey), skip below 4.0 (red)
  const tier = (r) => r == null ? 't0' : r >= 8.5 ? 't1' : r >= 7 ? 't2' : r >= 4 ? 't3' : 'tr';
  // Averages (team ratings, Outlook predictions) sit in a narrower band: 7.0+, 6.3–6.9, 5.3–6.2, below 5.3 (graded on the shown, rounded value)
  const atier = (a) => { const r = Math.round(a * 10) / 10; return r >= 7 ? 't1' : r >= 6.3 ? 't2' : r >= 5.3 ? 't3' : 'tr'; };
  const byRating = (a, b) => (b.rt ?? -1) - (a.rt ?? -1);
  const label = (c) => FLAG[c] + '<span>' + C[c] + '</span>';

  const ICON = {
    prev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    next: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
    eye: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    bars: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    chev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="chev"><path d="M6 9l6 6 6-6"/></svg>',
    eyeoff: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7c2 0 3.7.6 5.1 1.5M22 12s-3.5 7-10 7c-2 0-3.7-.6-5.1-1.5"/><circle cx="12" cy="12" r="3"/><path d="M3 21L21 3"/></svg>',
    breakdown: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="4.5" rx="1.3"/><rect x="3" y="9.75" width="18" height="4.5" rx="1.3"/><rect x="3" y="16.5" width="12" height="4.5" rx="1.3"/></svg>',
    noplay: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/><path d="M3 21L21 3"/></svg>',
    info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.01"/></svg>',
    latest: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 6l6 6-6 6"/><path d="M19 12H5"/><path d="M5 6v12"/></svg>',
    play: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/></svg>'
  };

  let D = [], loaded = false, failed = false, FX = {};
  const rev = new Set(), why = new Set(), openRows = new Set(), worst = new Set(), favOpen = new Set();
  let infoOpen = false;
  // st.next: the Week tab shows the upcoming week (all leagues) or the next round (one league) with predictions
  const st = { day: null, comp: 'all', round: null, week: null, next: false, favCollapsed: false, compact: true, tsort: { k: 'avg', d: -1 } };
  try { const s = JSON.parse(localStorage.getItem('sfr-prefs') || '{}'); if (s.comp === 'all' || C[s.comp]) st.comp = s.comp; st.favCollapsed = !!s.favCollapsed; if (s.tsort && ['rk', 'n', 'k', 'rng', 'avg'].includes(s.tsort.k) && (s.tsort.d === 1 || s.tsort.d === -1)) st.tsort = s.tsort; } catch (e) {}
  const savePrefs = () => { try { localStorage.setItem('sfr-prefs', JSON.stringify({ comp: st.comp, favCollapsed: st.favCollapsed, tsort: st.tsort })); } catch (e) {} };
  // Tabs: Day, Week (default), Season. Old links (#matchweek, #best) still work; #outlook opens the upcoming week.
  if (location.hash === '#outlook') { st.next = true; history.replaceState(null, '', '#week'); }
  const view = () => { const h = location.hash.slice(1); return h === 'season' || h === 'best' ? 'best' : h === 'day' ? h : 'matchweek'; };

  // ---- Predicted potential for matches still to come ----
  // Each team's average goals per match and average combined xG (league average when a team has no data yet),
  // both standardised within the round and added up. The round's top 3 are "high", the bottom 3 "low", the rest "medium"
  // (top/bottom 2 in rounds of 6–8 matches, 1 in rounds of 3–5). Shown as 3 / 2 / 1 lit flames, never as a number.
  let PRED = new Map();
  const fxKey = (c, h, a) => c + '|' + h + '|' + a;
  const goalsOf = (s) => { const g = String(s || '').match(/(\d+)\s*[–-]\s*(\d+)/); return g ? [+g[1], +g[2]] : null; };
  const xgOf = (m) => { for (const x of m.w || []) { const g = String(x[0]).match(/^Chances \(xG ([\d.]+)\)/); if (g) return +g[1]; } return m.x && m.x.h && m.x.a && m.x.h.xg != null && m.x.a.xg != null ? m.x.h.xg + m.x.a.xg : null; };
  function buildPred() {
    PRED = new Map();
    Object.values(FX).forEach((fx) => {
      const c = fx.c, ms = D.filter((m) => m.c === c && m.rt != null), T = {};
      ms.forEach((m) => { const g = goalsOf(m.s), xg = xgOf(m); [m.h, m.a].forEach((n) => { const t = T[n] = T[n] || { g: [], x: [] }; if (g) t.g.push(g[0] + g[1]); if (xg != null) t.x.push(xg); }); });
      const mean = (a) => a.reduce((s, v) => s + v, 0) / a.length;
      const lg = (k) => { const v = Object.values(T).filter((t) => t[k].length).map((t) => mean(t[k])); return v.length ? mean(v) : 0; };
      const lgG = lg('g'), lgX = lg('x');
      const av = (n, k, d) => (T[n] && T[n][k].length ? mean(T[n][k]) : d);
      const rows = (fx.matches || []).map((f) => ({ f, g: (av(f.h, 'g', lgG) + av(f.a, 'g', lgG)) / 2, x: (av(f.h, 'x', lgX) + av(f.a, 'x', lgX)) / 2 }));
      if (!rows.length) return;
      const z = (k) => { const v = rows.map((r) => r[k]), mu = mean(v), sd = Math.sqrt(mean(v.map((a) => (a - mu) ** 2))) || 1; rows.forEach((r) => { r['z' + k] = (r[k] - mu) / sd; }); };
      z('g'); z('x');
      rows.forEach((r) => { r.p = r.zg + r.zx; });
      const n = rows.length, k = n >= 9 ? 3 : n >= 6 ? 2 : n >= 3 ? 1 : 0;
      rows.slice().sort((p, q) => q.p - p.p).forEach((r, i) => PRED.set(fxKey(c, r.f.h, r.f.a), { c, r: fx.r, d: r.f.d, h: r.f.h, a: r.f.a, p: r.p, lvl: i < k ? 3 : i >= n - k ? 1 : 2 }));
    });
  }
  const POT = { 3: 'High potential', 2: 'Medium potential', 1: 'Low potential' };
  const FLAME = '<path d="M8 1c1 3 4 4.5 4 8a4 4 0 0 1-8 0c0-2 1-3 1.6-4 .3 1.4 1 2 1.6 2C7.6 5 7 3 8 1z"/>';
  const flames = (lvl) => [0, 1, 2].map((i) => '<svg viewBox="2 0 12 16" aria-hidden="true"><g class="f' + (i < lvl ? ' on' : '') + '">' + FLAME + '</g></svg>').join('');
  const potChip = (lvl) => '<span class="chip pot p' + lvl + '" role="img" aria-label="' + POT[lvl] + '" title="' + POT[lvl] + ' (prediction)">' + flames(lvl) + '</span>';
  // The fixtures of a league's next round that are not rated yet, as rows (a stored, unrated match keeps its own entry)
  const openFixtures = (c) => { const fx = FX[c]; if (!fx) return []; return (fx.matches || []).filter((f) => !D.some((m) => m.c === c && m.h === f.h && m.a === f.a && m.rt != null))
    .map((f) => D.find((m) => m.c === c && m.h === f.h && m.a === f.a) || { id: 'fx:' + fxKey(c, f.h, f.a), c, r: fx.r, d: f.d, h: f.h, a: f.a, rt: null, s: '', w: [] }); };

  // ---- Opened match: factors per team (with the score) and the rating breakdown ----
  const ord = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
  const mins = (a) => (a || []).map((t) => { const g = String(t).match(/^(\d+(?:\+\d+)?)\s*(p|pen|og)?$/i); return g ? g[1] + '′' + (g[2] ? (/^og$/i.test(g[2]) ? ' (og)' : ' (pen)') : '') : String(t); }).join(' · ');
  function factsBox(m) {

  // What counted for each step: stored by the daily run as a third value; for older matches worked out where it is unambiguous

  }

  // Match row: centred pairing (flag | home · box · away | ▶ or weekday). The box is the rating, the score once revealed,

      '<button type="button" class="ib" data-act="why" data-id="' + esc(id) + '" aria-pressed="' + w + '" aria-label="Rating breakdown" title="Rating breakdown">' + ICON.breakdown + '</button>';

    // Same centred row everywhere; in ranked lists (Season) the position sits in front of the flag
    let h = '<div class="row crow' + (pos != null ? ' haspos' : '') + (open ? ' open' : '') + '"><div class="line">' + hit +
        '<span class="side l' + (withFlag ? '' : ' dim') + '">' + (withFlag ? FLAG : FLAGG)[m.c] + (pos != null ? '<span class="pos">' + pos + '</span>' : '') + '</span>' +
        '<span class="hn">' + nm(m.h) + '</span>' + chip + '<span class="an">' + nm(m.a, 1) + '</span><span class="side r">' + hl + '</span></div>';

  const card = (rows) => '<div class="card">' + rows.join('') + '</div>';
  const emptyCard = (t) => '<div class="card"><div class="empty">' + t + '</div></div>';
  const sectionHtml = (labelHtml, rows) => '<section><h2 class="label">' + labelHtml + '</h2>' + card(rows) + '</section>';
  // Compact one-line list row for a team: rank, average (team scale), flag + name, games played on the right
  const teamLine = (x, rank, withFlag, act) => {
    const inner = '<span class="pos">' + rank + '</span><span class="chip small ' + atier(x.avg) + '">' + x.avg.toFixed(1) + '</span>' +
      '<span class="fx"><span class="teams">' + (withFlag ? FLAG[x.c] : '') + nm(x.n, 1) + '</span></span><span class="rt">' + x.k + (x.k === 1 ? ' match' : ' matches') + '</span>';

  };
  // Period bar at the top of every tab: title centred; Day and Week get ‹ ›, plus a "latest" button when you've moved away from the latest day/week/round
  const pbar = (title, sub, nav) => {

    // The "latest" button sits on the side the latest period is on: right when looking back, left when looking ahead (nav.ahead)

    const lb = nav.latest ? '<button type="button" class="sq' + (nav.ahead ? ' back' : '') + '" data-act="latest" aria-label="Back to the latest ' + nav.what + '" title="Latest ' + nav.what + '">' + ICON.latest + '</button>' : ph1;

      '<div class="pt"><h1>' + esc(title) + '</h1><div class="sub">' + esc(sub) + '</div></div>' +
      (nav.ahead ? ph1 : lb) +

  };
  const cnt = (ms) => { const p = ms.filter((m) => m.rt != null).length, u = ms.length - p; return p + (p === 1 ? ' match' : ' matches') + (u ? ' (+' + u + ' to come)' : ''); };
  const roundOf = (m) => RN[m.c] + ' ' + m.r;

  const allDays = () => Array.from(new Set(D.map((m) => m.d))).sort();
  const isFav = (m) => FAV.has(m.h) || FAV.has(m.a);
  const inComp = (m) => st.comp === 'all' || m.c === st.comp;
  const comps = () => ORDER.filter((c) => D.some((m) => m.c === c));
  function weeks() {

  function teamTable(ms) {

  }
  // Team table: tap a column heading to sort by it, tap again to reverse. # always shows the position by average rating.
  const TCOL = [['rk', '#', 'Position by average rating', 1], ['n', 'Team', 'Team name', 1], ['k', 'M', 'Matches played', -1], ['rng', 'Rng', 'Best minus worst match rating', -1], ['avg', 'Avg', 'Average rating', -1]];
  const tHead = () => '<div class="trow thead"><span></span>' + TCOL.map(([k, lab, tip]) => {

      '<span class="c n" title="Matches played">' + x.k + '</span><span class="c n" title="Best minus worst match rating">' + (x.b - x.lo).toFixed(1) + '</span><span class="c avg ' + atier(x.avg).replace('t', 'a') + '" title="Average rating">' + x.avg.toFixed(1) + '</span>';

  };
  const teamRow = (x, i, withFlag) => '<div class="tm"><span class="pos">' + (i + 1) + '</span><span class="n">' + (withFlag ? FLAG[x.c] + ' ' : '') + nm(x.n, 1) + '</span><span class="g">' + x.k + (x.k === 1 ? ' match' : ' matches') + '</span><span class="chip small ' + atier(x.avg) + '">' + x.avg.toFixed(1) + '</span></div>';

  }

          '<div class="cap3">Their best match</div>' + card([row(best, [short(best.d), roundOf(best)], null, true)]) + '</div>');

      comps().map((k) => '<button type="button" data-act="comp" data-id="' + k + '" aria-pressed="' + (k === st.comp) + '" aria-label="' + C[k] + '" title="' + C[k] + '">' + FLAG[k] + '</button>').join('') + '</div>';
  }

  // Lists: rated matches by rating, then matches still to come by predicted potential
  const byRatingThenPred = (a, b) => (a.rt == null) - (b.rt == null) || (a.rt != null ? b.rt - a.rt : byPred(a, b));

  function renderDay(P) {

    if (!ms.length) return emptyCard('No ' + C[st.comp] + ' matches on this day.');
    // Every match once, in one list sorted by rating (flag only when all leagues are shown)
    return card(ms.map((m) => row(m, [], null, st.comp === 'all')));
  }

  // Potential count for the upcoming matches shown, for the ⓘ text: n matches · 🔥🔥🔥 n · 🔥🔥 n · 🔥 n
  const potCount = (ms) => {
    const n = { 3: 0, 2: 0, 1: 0 }; ms.forEach((m) => { const p = predOf(m); if (p) n[p.lvl]++; });
    return '<span class="potv">' + ms.length + (ms.length === 1 ? ' match' : ' matches') + ': ' +
      [3, 2, 1].map((l) => '<span class="chip pot p' + l + '" role="img" aria-label="' + POT[l] + '">' + flames(l) + '</span>&nbsp;' + n[l]).join(' <span class="sep">·</span> ') + '</span>';
  };

  function renderNext(P) {
    const ms = P.ms;
    if (!ms.length) return emptyCard('No upcoming matches stored yet.');
    if (st.comp !== 'all') return card(ms.map((m) => row(m, [], null, false)));
    // All leagues: the top pick of each league, then every league's round sorted by potential
    let h = '';
    const tops = ORDER.map((c) => ms.find((m) => m.c === c)).filter(Boolean).sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : ORDER.indexOf(a.c) - ORDER.indexOf(b.c)));
    if (tops.length > 1) h += sectionHtml('Top pick per league', tops.map((m) => row(m, [], null, true)));
    ORDER.forEach((c) => { const x = ms.filter((m) => m.c === c); if (x.length) h += sectionHtml(label(c) + ' <span class="favsub">· ' + RN[c] + ' ' + x[0].r + '</span>', x.map((m) => row(m, [], null, false))); });
    return h;
  }

  function renderMatchweek(P) {
    if (P.next) return renderNext(P);
    if (st.comp === 'all') {
      const ms = D.filter((m) => m.d >= P.from && m.d <= P.to).concat(extraFixtures((m) => m.d >= P.from && m.d <= P.to)).sort(byRatingThenPred);
      if (!ms.length) return emptyCard('No matches this week.');
      return card(ms.map((m) => row(m, [], null, true)));
    }
    const c = st.comp, r = st.round;
    const ms = D.filter((m) => m.c === c && m.r === r).concat(extraFixtures((m) => m.c === c && m.r === r)).sort(byRatingThenPred);
    return card(ms.map((m) => row(m, [], null, false)));
  }

  function renderBest() {
    const rated = D.filter((m) => m.rt != null);
    const leagues = ORDER.filter((c) => rated.some((m) => m.c === c) && (st.comp === 'all' || c === st.comp));
    const n = rated.filter(inComp).length;
    let h = '<div class="grid">';
    // A list shows its best five; "Show worst" adds the bottom five (with their real positions), and ⋮ marks the ranks in between when there are more than 10
    const toggle = (key, open, word) => '<button type="button" class="ghost more" data-act="worst" data-id="' + key + '" aria-expanded="' + open + '">' + (open ? 'Hide ' : 'Show ') + word + ICON.chev + '</button>';
    const expand = (items, key, draw, withBtn, isTeams) => {
      const word = isTeams && !['avg', 'rk'].includes(st.tsort.k) ? 'bottom five' : 'worst';
      const open = worst.has(key), n = items.length;
      let idx = items.map((_, i) => i);
      if (!open) idx = idx.slice(0, 5); else if (n > 10) idx = idx.slice(0, 5).concat([-1], idx.slice(n - 5));
      const body = idx.map((i) => i < 0 ? '<div class="gapdots" aria-label="positions 6 to ' + (n - 5) + ' hidden">⋮</div>' : draw(items[i], i)).join('');
      return { html: body + (withBtn && n > 5 ? toggle(key, open, word) : ''), cls: n >= 100 ? ' rk3' : '' };
    };
    const box = (key, teams, games, flagged, meta, right) => {
      if (st.compact) {
        // Compact: flat card with "Teams" and "Games" lists, each with its own "Show worst"
        const t = expand(tSort(ranked2(teams)), 'T|' + key, (x) => tRow(x, x.rk, flagged), true, true);
        const g = expand(games, 'G|' + key, (m) => row(m, [], null, flagged), true);
        return '<div class="cap3 games">Teams</div><div class="rows ttab' + t.cls + '">' + tHead() + t.html + '</div>' +
          '<div class="cap3 games">Matches</div><div class="rows' + g.cls + '">' + g.html + '</div>';
      }
      const t = expand(tSort(ranked2(teams)), 'T|' + key, (x) => tRow(x, x.rk, flagged), true, true);
      const g = expand(games, 'G|' + key, (m) => row(m, meta(m), null, flagged), true);
      return '<div class="cap3 games">Teams</div><div class="rows ttab' + t.cls + '">' + tHead() + t.html + '</div>' +
        '<div class="cap3 games">Matches</div><div class="rows' + g.cls + '">' + g.html + '</div>';
    };
    // Ties: older game first, so among equally rated games the most recent sits lowest
    const ranked = (ms) => ms.slice().sort((a, b) => b.rt - a.rt || (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
    // League average: mean match rating, shown in the card header as a rating box (two decimals, the leagues sit close together)
    const lavg = (ms) => { if (!ms.length) return ''; const a = ms.reduce((s2, m) => s2 + m.rt, 0) / ms.length; return '<span class="lavg" title="League average rating"><span class="chip small ' + tier(a) + '">' + a.toFixed(2) + '</span></span>'; };
    if (st.comp === 'all') {
      h += '<section class="card league overall"><h3>All leagues' + lavg(rated) + '</h3>' + box('all', teamTable(rated), ranked(rated), true, (m) => [short(m.d)], (m) => dm(m.d)) + '</section>';
    }
    leagues.forEach((c) => {
      const ms = rated.filter((m) => m.c === c);
      h += '<section class="card league"><h3>' + label(c) + lavg(ms) + '</h3>' + box(c, teamTable(ms), ranked(ms), false, (m) => [short(m.d), roundOf(m)], (m) => RS[m.c] + m.r) + '</section>';
    });
    return h + '</div>';
  }

  function periodBar(v, P) {
    if (v === 'best') { const n = D.filter((m) => m.rt != null && inComp(m)).length; return pbar('Season 2026–27', n + (n === 1 ? ' match' : ' matches')); }
    if (v === 'day') { const ms = D.filter((m) => m.d === st.day && inComp(m)); return pbar(short(st.day), cnt(ms), { what: 'day', canPrev: P.i > 0, canNext: P.i < P.days.length - 1, latest: !P.atDefault }); }
    if (P.next) {
      const n = P.ms.length, dates = P.from ? (P.from === P.to ? dm(P.from) : span(P.from, P.to)) + ' · ' : '';
      const title = st.comp === 'all' ? 'Next week' : RN[st.comp] + ' ' + (P.ms[0] ? P.ms[0].r : '');
      return pbar(title, dates + n + ' to come', { what: st.comp === 'all' ? 'week' : 'round', canPrev: true, canNext: false, latest: true, ahead: true });
    }
    if (st.comp === 'all') { const ms = D.filter((m) => m.d >= P.from && m.d <= P.to).concat(extraFixtures((m) => m.d >= P.from && m.d <= P.to)); return pbar(span(P.from, P.to), cnt(ms), { what: 'week', canPrev: P.i > 0, canNext: P.i < P.ws.length - 1 || hasNext(), latest: !P.atDefault }); }
    const ms = D.filter((m) => m.c === st.comp && m.r === st.round).concat(extraFixtures((m) => m.c === st.comp && m.r === st.round));
    return pbar(RN[st.comp] + ' ' + st.round, cnt(ms), { what: 'round', canPrev: P.i > 0, canNext: P.i < P.rounds.length - 1 || hasNext(), latest: !P.atDefault });
  }

  // One ⓘ per tab, at the right end of the "All matches" / "All teams" header
  const KEY = '<span class="k t1">8.5+</span> must watch · <span class="k t2">7+</span> worth it · <span class="k t3">4+</span> average · <span class="k tr">below 4</span> skip';
  const FLAMEKEY = 'Flames are a prediction for matches still to come, based on both teams’ goals and xG so far: 3 = among the round’s most promising, 1 = among its least. Only a rough hint – the round’s best match is in the top 3 about half the time.';
  const INFO = {
    day: 'Every match of the selected day, sorted by rating. The rating (0–10) says how worth watching a match is, without giving anything away.<br>' + KEY + '<br>Tap a match to reveal the score with each team’s figures, or to see how the rating is built. ▶ opens the highlights.<br>' + FLAMEKEY,
    matchweek: 'All matches from Tuesday to Monday, sorted by rating. Choose a league to see one round instead.<br>' + KEY + '<br>The arrows move week by week (or round by round); the button next to them jumps back to the latest one. › after the latest week shows the next week (or round) with a prediction for each match.<br>' + FLAMEKEY,
    best: 'Teams: M = matches played, Rng = best minus worst match rating (high = unpredictable, low = consistent), Avg = the avg rating of all their matches – who is most worth watching this season. Team avgs use a narrower colour scale: green from 6.3, bright green from 7.0, red below 5.3. Tap a column heading to sort the table, tap it again to reverse.<br>Matches: the best rated matches so far; “Show worst” adds the worst. The number next to each league is its avg rating.'
  };
  const sectionHead = (v, P) => '<div class="favhead sect"><h2 class="label">' + (v === 'best' ? 'League' : 'Matches') + '</h2>' +
    '<button type="button" class="ghost info" data-act="info" aria-expanded="' + infoOpen + '" aria-controls="infobox" aria-label="About this tab" title="About this tab">' + ICON.info + '</button>' +
    (infoOpen ? '<div class="infobox bubble" id="infobox" role="dialog" aria-label="About this tab">' + INFO[v] + (P && P.next ? '<br><b>' + (st.comp === 'all' ? 'Next week' : 'This round') + ':</b> ' + potCount(P.ms) : '') + '</div>' : '') + '</div>';

  function render() {
    const v = view();
    document.body.classList.add('compact');
    document.querySelectorAll('nav a').forEach((a) => { if (a.dataset.view === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    document.getElementById('wrap').classList.toggle('wide', v === 'best');
    const main = document.getElementById('main');
    if (!loaded) { main.innerHTML = emptyCard(failed ? 'Ratings can’t be loaded right now. Check your connection and open the app again.' : 'Loading ratings…'); return; }
    if (!D.length) { main.innerHTML = emptyCard('No ratings yet. The daily digest adds the previous day’s matches every morning.'); return; }
    if (st.comp !== 'all' && !comps().includes(st.comp)) st.comp = 'all';
    const P = resolve(v);
    const content = v === 'matchweek' ? renderMatchweek(P) : v === 'best' ? renderBest() : renderDay(P);
    // Under the league pills: a header naming the selection (All leagues / the league), like the section headers of the next week.
    // The next week with all leagues already brings its own sections (top picks, one per league).
    const sel = st.comp === 'all' ? '<span>All leagues</span>' : label(st.comp);
    const body = v === 'matchweek' && P.next && st.comp === 'all' ? content : '<section class="selsec"><h2 class="label">' + sel + '</h2>' + content + '</section>';
    main.innerHTML = periodBar(v, P) + favorites(v, P) + '<div class="sepline" role="presentation"></div>' + sectionHead(v, P) + pills() + body;
  }

  document.addEventListener('click', (e) => {
    // An open ⓘ bubble closes when you tap anywhere outside it
    if (infoOpen && !e.target.closest('.bubble') && !e.target.closest('[data-act="info"]')) {
      infoOpen = false;
      if (!e.target.closest('button[data-act]')) { const y = window.scrollY; render(); window.scrollTo(0, y); return; }
    }
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id, v = view();
    // Keep the page where it is: re-rendering must not scroll. When a list is collapsed, keep its toggle under the finger instead.
    const y0 = window.scrollY, top0 = b.getBoundingClientRect().top, collapsing = act === 'worst' && worst.has(id);
    if (act === 'open') { openRows.has(id) ? openRows.delete(id) : openRows.add(id); }
    else if (act === 'score') { rev.has(id) ? rev.delete(id) : rev.add(id); }
    else if (act === 'why') { why.has(id) ? why.delete(id) : why.add(id); }
    else if (act === 'worst') { worst.has(id) ? worst.delete(id) : worst.add(id); }
    else if (act === 'favteam') { favOpen.has(id) ? favOpen.delete(id) : favOpen.add(id); }
    else if (act === 'info') { infoOpen = !infoOpen; }
    else if (act === 'tsort') { const col = TCOL.find((x) => x[0] === id); st.tsort = st.tsort.k === id ? { k: id, d: -st.tsort.d } : { k: id, d: col ? col[3] : -1 }; savePrefs(); }
    else if (act === 'latest') { st.next = false; if (v === 'day') st.day = null; else if (st.comp === 'all') st.week = null; else st.round = null; }
    else if (act === 'favtoggle') { st.favCollapsed = !st.favCollapsed; savePrefs(); }
    else if (act === 'comp') { st.comp = id; st.round = null; if (st.next && !hasNext()) st.next = false; savePrefs(); }
    else if (act === 'prev' || act === 'next') {
      const step = act === 'prev' ? -1 : 1;
      if (v === 'day') { const ds = allDays(); const i = ds.indexOf(st.day) + step; if (ds[i]) st.day = ds[i]; }
      else if (v === 'matchweek' && st.next) { if (step < 0) { st.next = false; st.week = null; st.round = null; const ws = weeks(); if (ws.length) st.week = ws[ws.length - 1]; const rs = Array.from(new Set(D.filter((m) => m.c === st.comp).map((m) => m.r))).sort((x, y) => x - y); if (rs.length) st.round = rs[rs.length - 1]; } }
      else if (v === 'matchweek' && st.comp === 'all') { const ws = weeks(); const i = ws.indexOf(st.week) + step; if (ws[i]) st.week = ws[i]; else if (step > 0 && hasNext()) st.next = true; }
      else if (v === 'matchweek') { const rs = Array.from(new Set(D.filter((m) => m.c === st.comp).map((m) => m.r))).sort((x, y) => x - y); const i = rs.indexOf(st.round) + step; if (rs[i] != null) st.round = rs[i]; else if (step > 0 && hasNext()) st.next = true; }
    }
    render();
    let f = null;
    if (act === 'latest') f = document.querySelector('[data-act="next"]');
    if (['open', 'score', 'why', 'worst', 'favteam', 'tsort'].includes(act)) f = document.querySelector('[data-act="' + act + '"][data-id="' + CSS.escape(id) + '"]');
    if (['prev', 'next', 'comp', 'favtoggle', 'info'].includes(act)) f = document.querySelector('[data-act="' + act + '"]' + (act === 'comp' ? '[data-id="' + id + '"]' : ''));
    if (f && !f.disabled) f.focus({ preventScroll: true });
    window.scrollTo(0, y0);
    if (collapsing && f) window.scrollBy(0, f.getBoundingClientRect().top - top0);
  });
  window.addEventListener('hashchange', () => { infoOpen = false; if (location.hash === '#outlook') { st.next = true; history.replaceState(null, '', '#week'); } render(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && infoOpen) { infoOpen = false; const y = window.scrollY; render(); window.scrollTo(0, y); const f = document.querySelector('[data-act="info"]'); if (f) f.focus({ preventScroll: true }); } });
  render();

  // Data: data/matches.json ({ updated, matches: [ {id, c, r, d, h, a, rt, s, w, q} ] }) and data/fixtures.json ({ <league>: {c, r, matches: [{h, a, d}]} }).
  // Loaded on start and again whenever the app comes back to the foreground, so the morning update shows up without a reload.
  async function load() {
    try {
      const get = (u) => fetch(u + '?t=' + Date.now(), { cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
      const [d, f] = await Promise.all([get('data/matches.json'), get('data/fixtures.json').catch(() => ({}))]);
      D = (d.matches || []).filter((m) => m && m.id && m.h && m.a && C[m.c]);
      const fx = {}; Object.values(f || {}).forEach((b) => { if (b && C[b.c] && Array.isArray(b.matches)) fx[b.c] = b; });
      FX = fx; loaded = true; failed = false; buildPred();
    } catch (e) { if (!loaded) failed = true; }
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }
  load();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>

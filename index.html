/* Layout: mobile-first single column (wider grid for Season); game rows closed by default, tap to open the action bar. Dark-only by design. */

/* One line per game, only green and red get a filled box, no row arrows, flat Season cards */

  const mins = (a) => (a || []).map((t) => { const g = String(t).match(/^(\d+(?:\+\d+)?)\s*(p|pen|og)?$/i); return g ? g[1] + '′' + (g[2] ? (/^og$/i.test(g[2]) ? ' (og)' : ' (pen)') : '') : String(t); }).join(' · ');
  function factsBox(m) {
    const x = m.x || {}, H = x.h || {}, A = x.a || {}, g = goalsOf(m.s);
    const num = (v, dec) => (v == null ? null : dec ? (+v).toFixed(1) : String(v));
    const reds = (t) => (t.rc ? String(t.rc.length) + (t.rc.length ? ' (' + mins(t.rc) + ')' : '') : null);
    const pens = (t) => (t.ps == null && t.pm == null ? null : (t.ps || t.pm) ? [t.ps ? t.ps + ' scored' : '', t.pm ? t.pm + ' missed' : ''].filter(Boolean).join(' · ') : '0');
    const lines = [
      ['Goals', g ? String(g[0]) : num(H.g), g ? String(g[1]) : num(A.g)],
      ['Goal minutes', H.gm ? mins(H.gm) || '–' : null, A.gm ? mins(A.gm) || '–' : null, 'sm'],
      ['xG', num(H.xg, 1), num(A.xg, 1), 'lead'], ['Big chances', num(H.bc), num(A.bc), 'lead'],
      ['Shots on target', num(H.sot), num(A.sot), 'lead'], ['Shots', num(H.sh), num(A.sh), 'lead'],

      ['Disallowed goals', num(H.dis), num(A.dis)], ['VAR awards', num(H.var), num(A.var)],

    const cell = (v, other, ln, side) => {

    };

    if (typeof x.derby === 'boolean') h += '<div class="stl foot"><span class="k">' + (x.derby ? 'Derby' : 'Not a derby') + '</span></div>';
    else if (!m.x) h += '<div class="stl foot"><span class="k">More figures per team are stored for matches from 23 Nov 2026 on</span></div>';
    return '<div class="panel" data-p="facts">' + h + '</div>';
  }
  // What counted for each step: stored by the daily run as a third value; for older matches worked out where it is unambiguous
  function whatCounted(name, label, val, m) {
    const pm = label.match(/\((.*)\)$/); if (pm) return pm[1];
    const v = parseFloat(String(val).replace('−', '-')), g = goalsOf(m.s);
    if (name === 'Goals' && g) { const n = g[0] + g[1]; return n + (n === 1 ? ' goal' : ' goals'); }
    if (name === 'Close match') return v === 0.5 ? 'margin 0–1' : v === 0.7 ? 'margin 0–1 · close at 75′' : v === 0.2 ? 'close at 75′' : '';
    if (name === 'One-sided') return 'margin 3 or more';
    if (name === 'Equalisers & lead changes') return v === 0.5 ? '1 equaliser or lead change' : v >= 1 ? '2 or more' : '';
    if (name === 'Comeback') return v === 0.5 ? 'from 2 down to draw' : v === 1.2 ? 'from 3+ down to win' : '';
    return '';
  }
  // Points colours: +1.0 and more bright green, +0.5 to +0.9 light green, +0.1 to +0.4 and the starting score grey, minus and caps red
  const ptClass = (name, val) => { if (name === 'Starting score') return 'pgrey'; const v = parseFloat(String(val).replace('−', '-')); if (isNaN(v) || v < 0) return 'pneg'; return v >= 1 ? 'pbig' : v >= 0.5 ? 'pmid' : 'pgrey'; };
  function whyBox(m) {
    let h = '';
    (m.w || []).forEach((x) => {
      const full = whyLabel(x[0]), name = full.replace(/\s*\(.*\)$/, ''), detail = x[2] || whatCounted(name, full, x[1], m);
      const val = name === 'Starting score' ? String(x[1]).replace(/^\+/, '') : String(x[1]).replace(/^-/, '−');
      h += '<div class="bkl"><div class="bn">' + esc(name) + (detail ? '<div class="bc">' + esc(detail) + '</div>' : '') + '</div><span class="bp ' + ptClass(name, x[1]) + '">(' + esc(val) + ')</span></div>';
    });
    if (m.rt != null) h += '<div class="bkl tot"><div class="bn">Rating</div><span class="chip ' + tier(m.rt) + '">' + m.rt.toFixed(1) + '</span></div>';
    return '<div class="panel" data-p="why">' + h + '</div>';
  }

  // Match row: centred pairing (flag | home · box · away | ▶ or weekday). The box is the rating, the score once revealed,
  // or the predicted potential (flames) for a match still to come. Tap a played match for the score (eye) and the breakdown (bars).
  function row(m, metaParts, pos, withFlag) {
    const id = m.id, key = (withFlag ? 'x:' : '') + id, played = m.rt != null, on = played && rev.has(id), w = why.has(id), open = played && openRows.has(key);
    const pr = played ? null : predOf(m);
    const link = m.q ? 'https://www.youtube.com/results?search_query=' + encodeURIComponent(m.q).replace(/%2B/g, '+') : '';
    const hl = !played ? (m.d ? '<span class="day" title="' + esc(short(m.d)) + '">' + wd(m.d) + '</span>' : '') : link
      ? '<a class="hl" href="' + esc(link) + '" target="_blank" rel="noopener" aria-label="Highlights on YouTube" title="Highlights on YouTube">' + ICON.play + '</a>'
      : '<span class="hl off" role="img" aria-label="No highlights link" title="No highlights link for the ' + esc(C[m.c]) + '">' + ICON.noplay + '</span>';
    const chip = on ? '<span class="chip score" title="Score">' + esc(String(m.s).replace(/\s*[–-]\s*/, '–')) + '</span>'
      : played ? '<span class="chip ' + tier(m.rt) + '">' + m.rt.toFixed(1) + '</span>'
      : pr ? potChip(pr.lvl) : '<span class="chip vs">vs</span>';
    const acts = '<button type="button" class="ib" data-act="score" data-id="' + esc(id) + '" aria-pressed="' + on + '" aria-label="' + (on ? 'Hide score' : 'Show score') + '" title="' + (on ? 'Hide score' : 'Show score') + '">' + (on ? ICON.eyeoff : ICON.eye) + '</button>' +
      '<button type="button" class="ib" data-act="why" data-id="' + esc(id) + '" aria-pressed="' + w + '" aria-label="Rating breakdown" title="Rating breakdown">' + ICON.breakdown + '</button>';
    const label = esc(m.h + ' vs ' + m.a + (played ? ', rating ' + m.rt.toFixed(1) : ''));
    const hit = played ? '<button type="button" class="hit" data-act="open" data-id="' + esc(key) + '" aria-expanded="' + open + '" aria-label="' + label + '"></button>' : '';
    // Same centred row everywhere; in ranked lists (Season) the position sits in front of the flag
    let h = '<div class="row crow' + (pos != null ? ' haspos' : '') + (open ? ' open' : '') + '"><div class="line">' + hit +
        '<span class="side l' + (withFlag ? '' : ' dim') + '">' + (withFlag ? FLAG : FLAGG)[m.c] + (pos != null ? '<span class="pos">' + pos + '</span>' : '') + '</span>' +
        '<span class="hn">' + nm(m.h) + '</span>' + chip + '<span class="an">' + nm(m.a, 1) + '</span><span class="side r">' + hl + '</span></div>';
    if (open) { h += '<div class="acts2">' + acts + '</div>'; if (on) h += factsBox(m); if (w) h += whyBox(m); }
    return h + '</div>';
  }
  const card = (rows) => '<div class="card">' + rows.join('') + '</div>';
  // big: a tall box for empty days / weeks / rounds, so there is plenty of room to swipe on
  const emptyCard = (t, big) => '<div class="card"><div class="empty' + (big ? ' big' : '') + '">' + t + '</div></div>';
  const sectionHtml = (labelHtml, rows) => '<section><h2 class="label">' + labelHtml + '</h2>' + card(rows) + '</section>';
  // Compact one-line list row for a team: rank, average (team scale), flag + name, games played on the right
  const teamLine = (x, rank, withFlag, act) => {
    const inner = '<span class="pos">' + rank + '</span><span class="chip small ' + atier(x.avg) + '">' + x.avg.toFixed(1) + '</span>' +
      '<span class="fx"><span class="teams">' + (withFlag ? FLAG[x.c] : '') + nm(x.n, 1) + '</span></span><span class="rt">' + x.k + (x.k === 1 ? ' match' : ' matches') + '</span>';
    return '<div class="row haspos">' + (act ? '<button type="button" class="rowbtn" ' + act + '>' + inner + '</button>' : '<div class="rowbtn static">' + inner + '</div>') + '</div>';
  };
  // Period bar at the top of every tab: title centred; Day and Week get ‹ ›, plus a "latest" button when you've moved away from the latest day/week/round
  const pbar = (title, sub, nav) => {
    const ph = '<span class="sq ph" aria-hidden="true"></span>';
    if (!nav) return '<div class="pbar">' + ph + ph + '<div class="pt"><h1>' + esc(title) + '</h1><div class="sub">' + esc(sub) + '</div></div>' + ph + ph + '</div>';
    // The "latest" button sits on the side the latest period is on: right when looking back, left when looking ahead (nav.ahead)
    const ph1 = '<span class="sq ph" aria-hidden="true"></span>';
    const lb = nav.latest ? '<button type="button" class="sq' + (nav.ahead ? ' back' : '') + '" data-act="latest" aria-label="Back to the latest ' + nav.what + '" title="Latest ' + nav.what + '">' + ICON.latest + '</button>' : ph1;
    return '<div class="pbar"><button type="button" class="sq" data-act="prev" aria-label="Previous ' + nav.what + '"' + (nav.canPrev ? '' : ' disabled') + '>' + ICON.prev + '</button>' + (nav.ahead ? lb : ph1) +
      '<div class="pt"><h1>' + esc(title) + '</h1><div class="sub">' + esc(sub) + '</div></div>' +
      (nav.ahead ? ph1 : lb) +
      '<button type="button" class="sq" data-act="next" aria-label="Next ' + nav.what + '"' + (nav.canNext ? '' : ' disabled') + '>' + ICON.next + '</button></div>';
  };
  const cnt = (ms) => { const p = ms.filter((m) => m.rt != null).length, u = ms.length - p; if (!p && u) return u + ' to come'; return p + (p === 1 ? ' match' : ' matches') + (u ? ' (+' + u + ' to come)' : ''); };
  const roundOf = (m) => RN[m.c] + ' ' + m.r;

  const allDays = () => Array.from(new Set(D.map((m) => m.d))).sort();
  // Days the Day view steps through: days with stored matches plus days with upcoming fixtures
  const dayList = () => Array.from(new Set(allDays().concat(ORDER.flatMap((c) => openFixtures(c)).map((m) => m.d).filter(Boolean)))).sort();
  const isFav = (m) => FAV.has(m.h) || FAV.has(m.a);
  const inComp = (m) => st.comp === 'all' || m.c === st.comp;
  const comps = () => ORDER.filter((c) => D.some((m) => m.c === c));
  function weeks() {
    const ds = allDays(); if (!ds.length) return [];
    const out = []; for (let w = tuesday(ds[0]); w <= tuesday(ds[ds.length - 1]); w = plusDays(w, 7)) out.push(w);
    return out;
  }
  function teamTable(ms) {
    const t = {};
    ms.forEach((m) => [m.h, m.a].forEach((n) => { const k = m.c + '|' + n; t[k] = t[k] || { n, c: m.c, s: 0, k: 0, b: 0, lo: 99 }; t[k].s += m.rt; t[k].k++; t[k].b = Math.max(t[k].b, m.rt); t[k].lo = Math.min(t[k].lo, m.rt); }));
    return Object.values(t).map((x) => ({ ...x, avg: x.s / x.k })).sort((p, q) => q.avg - p.avg || q.k - p.k || q.b - p.b);
  }
  // Team table: tap a column heading to sort by it, tap again to reverse. # always shows the position by average rating.
  const TCOL = [['rk', '#', 'Position by average rating', 1], ['n', 'Team', 'Team name', 1], ['k', 'M', 'Matches played', -1], ['rng', 'Rng', 'Best minus worst match rating', -1], ['avg', 'Avg', 'Average rating', -1]];
  const tHead = () => '<div class="trow thead"><span></span>' + TCOL.map(([k, lab, tip]) => {
    const on = st.tsort.k === k, dir = on ? (st.tsort.d === 1 ? 'ascending' : 'descending') : 'none';
    return '<button type="button" class="tsort' + (k === 'n' ? '' : ' c') + (on ? ' on' : '') + '" data-act="tsort" data-id="' + k + '" aria-sort="' + dir + '" title="Sort by ' + tip.toLowerCase() + '">' + lab + '<span class="arr" aria-hidden="true">' + (on ? (st.tsort.d === 1 ? '▲' : '▼') : '') + '</span></button>';
  }).join('') + '</div>';
  const tVal = { rk: (x) => x.rk, n: (x) => name(x.n).replace('★ ', '').toLowerCase(), k: (x) => x.k, rng: (x) => x.b - x.lo, avg: (x) => x.avg };
  const tSort = (rows) => { const f = tVal[st.tsort.k], d = st.tsort.d; return rows.slice().sort((p, q) => { const a = f(p), b = f(q); return (a < b ? -1 : a > b ? 1 : 0) * d || q.avg - p.avg; }); };
  const ranked2 = (table) => table.map((x, i) => ({ ...x, rk: i + 1 }));
  const tRow = (x, rank, withFlag, act) => {
    const inner = '<span class="tf">' + (withFlag ? FLAG : FLAGG)[x.c] + '</span><span class="c pos">' + (x.rk || rank) + '</span><span class="nm">' + nm(x.n, 1) + '</span>' +
      '<span class="c n" title="Matches played">' + x.k + '</span><span class="c n" title="Best minus worst match rating">' + (x.b - x.lo).toFixed(1) + '</span><span class="c avg ' + atier(x.avg).replace('t', 'a') + '" title="Average rating">' + x.avg.toFixed(1) + '</span>';
    return act ? '<button type="button" class="trow tbtn" ' + act + '>' + inner + '</button>' : '<div class="trow">' + inner + '</div>';
  };
  const teamRow = (x, i, withFlag) => '<div class="tm"><span class="pos">' + (i + 1) + '</span><span class="n">' + (withFlag ? FLAG[x.c] + ' ' : '') + nm(x.n, 1) + '</span><span class="g">' + x.k + (x.k === 1 ? ' match' : ' matches') + '</span><span class="chip small ' + atier(x.avg) + '">' + x.avg.toFixed(1) + '</span></div>';

  // ---- resolve the period each view shows (also used by Favorites) ----
  function resolve(v) {
    if (v === 'day') {
      const md = dayList();
      const p = md.filter((d) => D.some((m) => m.d === d && m.rt != null)), def = (p.length ? p : md).slice(-1)[0];
      if (st.day == null || !(md.includes(st.day) || (md.length && st.day >= md[0] && st.day <= plusDays(md[md.length - 1], 7)))) st.day = def;
      const days = md.includes(st.day) ? md : md.concat([st.day]).sort();

    }
    // Upcoming week / next round: the open fixtures of the leagues' next rounds, with predictions
    if (v === 'matchweek' && st.next && !hasNext()) st.next = false;
    if (v === 'matchweek' && st.next) {
      const ms = nextMatches(), ds = ms.map((m) => m.d).filter(Boolean).sort();
      return { next: true, ms, from: ds[0], to: ds[ds.length - 1], atDefault: false };
    }
    if (v === 'matchweek' && st.comp === 'all') {
      const ws = weeks();
      const r = ws.filter((w) => D.some((m) => m.rt != null && m.d >= w && m.d <= plusDays(w, 6))), def = (r.length ? r : ws).slice(-1)[0];
      if (st.week == null || !ws.includes(st.week)) st.week = def;

    }
    if (v === 'matchweek') {
      const rounds = Array.from(new Set(D.filter((m) => m.c === st.comp).map((m) => m.r))).sort((x, y) => x - y);
      const played = rounds.filter((x) => D.some((m) => m.c === st.comp && m.r === x && m.rt != null)), def = (played.length ? played : rounds).slice(-1)[0];
      if (st.round == null || !rounds.includes(st.round)) st.round = def;
      const ds = D.filter((m) => m.c === st.comp && m.r === st.round).map((m) => m.d).sort();
      return { rounds, i: rounds.indexOf(st.round), from: ds[0], to: ds[ds.length - 1], label: RN[st.comp] + ' ' + st.round + ' dates', atDefault: st.round === def };
    }
    return {};
  }

  // Next week (all leagues) or the selected league's next round: open fixtures, best predicted first
  // Only fixtures beyond what the normal navigation already reaches: after the last stored week (all leagues) or a round not stored yet (one league)
  const beyond = (m) => { if (st.comp !== 'all') return !D.some((x) => x.c === m.c && x.r === m.r); const ws = weeks(); return !ws.length || !m.d || m.d > plusDays(ws[ws.length - 1], 6); };

  function favorites(v, P) {
    let body = '', count = '';
    if (v === 'matchweek' && P.next) {
      // Like for played matches: your teams from every league in the shown period, whatever league is selected below
      const ms = ORDER.flatMap((c) => openFixtures(c)).filter((m) => isFav(m) && (!P.from || (m.d >= P.from && m.d <= P.to))).sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
      body = ms.length ? card(ms.map((m) => row(m, [], null, true))) : '<div class="card"><div class="empty small">' + (FAV.size ? 'No upcoming match of your teams stored yet.' : 'Pick your teams in Favourites.') + '</div></div>';

    } else if (v === 'best') {

      const parts = [];
      if (st.compact) {
        // Favourite teams in the same sortable table as below: position in their league, matches, range, average; tap for their best match
        const favRows = [];
        FAV.forEach((team) => {
          const mine = rated.filter((m) => m.h === team || m.a === team);

        });

          const f = favRows.find((x) => x.me === me);
          parts.push(tRow(me, me.rk, true, 'data-act="team" data-id="' + esc('fav|' + f.c + '|' + f.team) + '" title="' + esc(name(f.team)) + ': all matches"'));
        });
        body = parts.length ? '<div class="card ttab">' + tHead() + parts.join('') + '</div>' : '<div class="card"><div class="empty">No rated matches for your teams yet.</div></div>';
      } else FAV.forEach((team) => {
        const mine = rated.filter((m) => m.h === team || m.a === team);
        if (!mine.length) return;
        const c = mine[0].c, table = teamTable(rated.filter((m) => m.c === c)), me = table.find((x) => x.n === team);
        const best = mine.slice().sort(byRating)[0];
        parts.push('<div class="favteam"><div class="tm"><span class="n">' + FLAG[c] + ' ' + nm(team, 1) + '</span><span class="g">' + (table.indexOf(me) + 1) + '/' + table.length + ' · ' + me.k + (me.k === 1 ? ' match' : ' matches') + '</span><span class="chip small ' + atier(me.avg) + '">' + me.avg.toFixed(1) + '</span></div>' +
          '<div class="cap3">Their best match</div>' + card([row(best, [short(best.d), roundOf(best)], null, true)]) + '</div>');
      });

      const nt = Array.from(FAV).filter((t2) => rated.some((m) => m.h === t2 || m.a === t2)).length;
      count = nt + (nt === 1 ? ' team' : ' teams');
    } else {
      const ms = D.filter((m) => isFav(m) && m.d >= P.from && m.d <= P.to).sort((a, b) => a.d < b.d ? -1 : 1);
      body = ms.length ? card(ms.map((m) => row(m, [roundOf(m), v === 'day' ? '' : short(m.d)], null, true))) : '<div class="card"><div class="empty small">' + (FAV.size ? 'No match of your teams ' + (v === 'day' ? 'on this day' : st.comp === 'all' ? 'this week' : 'in this round') + '.' : 'Pick your teams in Favourites.') + '</div></div>';
      count = cnt(ms);
    }
    return '<section class="fav"><div class="favhead"><h2 class="label">' + '<svg class="hstar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.9l-5.25 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>' + 'Favourites <span class="favsub">' + esc(count) + '</span></h2>' +
      '<button type="button" class="ghost" data-act="favtoggle" aria-expanded="' + !st.favCollapsed + '" aria-controls="favbody">' + (st.favCollapsed ? 'Show' : 'Hide') + ICON.chev + '</button></div>' +
      '<div id="favbody"' + (st.favCollapsed ? ' hidden' : '') + '>' + body + '</div></section>';
  }

  function pills() {
    return '<div class="pills flags" role="group" aria-label="League">' +
      '<button type="button" data-act="comp" data-id="all" aria-pressed="' + (st.comp === 'all') + '" title="All leagues">All</button>' +
      comps().map((k) => '<button type="button" data-act="comp" data-id="' + k + '" aria-pressed="' + (k === st.comp) + '" aria-label="' + C[k] + '" title="' + C[k] + '">' + FLAG[k] + '</button>').join('') + '</div>';
  }

  // Lists: rated matches by rating, then matches still to come by predicted potential
  const byRatingThenPred = (a, b) => (a.rt == null) - (b.rt == null) || (a.rt != null ? b.rt - a.rt : byPred(a, b));

  function renderDay(P) {
    const d = st.day;
    const ms = D.filter((m) => m.d === d && inComp(m)).concat(extraFixtures((m) => m.d === d && inComp(m))).sort(byRatingThenPred);
    if (!ms.length) return emptyCard('No ' + (st.comp === 'all' ? '' : C[st.comp] + ' ') + 'matches on this day.', true);

    return card(ms.map((m) => row(m, [], null, st.comp === 'all')));
  }

  // Potential count for the upcoming matches shown, for the ⓘ text: n matches · 🔥🔥🔥 n · 🔥🔥 n · 🔥 n

      if (e.target.closest('.tpop, .search, input')) return;
      const el = document.querySelector('#main .slide'); if (!el) return;
      sw = { x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, on: false, el };
    }, { passive: true });
    area.addEventListener('touchmove', (e) => {
      if (!sw) return;
      const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
      if (!sw.on) {
        if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.6) sw.on = true;
        else { if (Math.abs(dy) > 14) sw = null; return; }
      }
      const btn = document.querySelector('#dbar [data-act="' + (dx < 0 ? 'next' : 'prev') + '"]'), ok = btn && !btn.disabled;
      sw.dx = dx; sw.ok = ok;
      if (moving()) { sw.el.style.transform = 'translateX(' + (ok ? dx * 0.6 : dx / 6) + 'px)'; sw.el.style.opacity = String(Math.max(0.5, 1 - Math.abs(dx) / 600)); }
    }, { passive: true });
    const end = () => {
      if (!sw) return; const s = sw; sw = null; if (!s.on) return;
      if (s.ok && Math.abs(s.dx) > 60) { const x = s.dx * 0.6; s.el.style.transform = ''; s.el.style.opacity = ''; go(s.dx < 0 ? 'next' : 'prev', moving() ? x : 0); }
      else reset(s.el);
    };
    area.addEventListener('touchend', end);
    area.addEventListener('touchcancel', () => { if (sw && sw.on) reset(sw.el); sw = null; });
  })();
  window.addEventListener('hashchange', () => { infoOpen = false; if (hp) { hp = null; } if (location.hash === '#outlook') { st.next = true; history.replaceState(null, '', '#week'); } render(); anim(document.querySelector('#main .slide'), [{ opacity: 0 }, { opacity: 1 }], { duration: 200 }); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (hp) { closeHp(); return; }
    if (pop) { if (popMenu) { popMenu = false; renderPop(); } else closePop(); return; }
    if (infoOpen) closeInfo(() => { keep(() => {}); const f = document.querySelector('[data-act="info"]'); if (f) f.focus({ preventScroll: true }); });
  });
  render();

  // Data: data/matches.json ({ updated, matches: [ {id, c, r, d, h, a, rt, s, w, q} ] }) and data/fixtures.json ({ <league>: {c, r, matches: [{h, a, d}]} }).
  // Loaded on start and again whenever the app comes back to the foreground, so the morning update shows up without a reload.
  async function load() {
    try {
      const get = (u) => fetch(u + '?t=' + Date.now(), { cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
      const [d, f, rl] = await Promise.all([get('data/matches.json'), get('data/fixtures.json').catch(() => ({})), get('data/runs.json').catch(() => ({}))]);
      RUNS = (rl && Array.isArray(rl.runs) ? rl.runs : []).filter((r) => r && r.start).sort((a, b) => (a.start < b.start ? 1 : -1));
      D = (d.matches || []).filter((m) => m && m.id && m.h && m.a && C[m.c]);
      const fx = {}; Object.values(f || {}).forEach((b) => { if (b && C[b.c] && Array.isArray(b.matches)) fx[b.c] = b; });
      FX = fx; loaded = true; failed = false; buildPred();
    } catch (e) { if (!loaded) failed = true; }
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }
  // Start screen stays about 1.5 s (longer only while the data is still on its way, at most 5 s), then fades into the app
  let splashGone = false;
  function hideSplash() {
    const sp = document.getElementById('splash'); if (!sp || sp.hidden || splashGone) return; splashGone = true;
    const wait = Math.max(0, 1500 - (performance.now() - (window.__splashAt || 0)));
    setTimeout(() => after(anim(sp, [{ opacity: 1 }, { opacity: 0 }], { duration: 420, fill: 'forwards' }), () => sp.remove()), wait);
  }
  setTimeout(hideSplash, 5000);
  load().then(hideSplash, hideSplash);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
  // Updates: check for a new version on every start and whenever the app comes back to the foreground;
  // when a new version takes over, reload once so it shows right away
  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {}));
  }
})();
</script>
